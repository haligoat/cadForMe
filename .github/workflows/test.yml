name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # the tests don't open the 3D window
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: No API keys in the repo
        run: |
          git ls-files | grep -E '(^|/)(apikeys\.json|onshape\.json|\.env)$' && { echo "key file committed"; exit 1; } || true
